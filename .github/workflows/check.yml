name: Application checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Toolchains
        run: |
          npm install --global npm@11.19.0
          rustup show
          node --version
          npm --version
          rustc --version
      - name: Rust checks
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path backend/Cargo.toml --locked
          cargo build --manifest-path backend/Cargo.toml --locked
      - name: Real storage and terminal integration
        run: python3 -m unittest discover -s tests -v
      - name: Web checks
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run build
          cd web
          npx playwright install --with-deps chromium
      - name: Browser initialization loop
        run: python3 tests/browser.py
      - name: Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.dev.yml config --quiet
      - name: Container builds
        run: |
          docker build -f deploy/backend.Dockerfile -t filehop-issue6-backend .
          docker build -f deploy/web.Dockerfile -t filehop-web-check .
          python3 tests/compose_smoke.py
