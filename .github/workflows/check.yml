name: Application checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Select container checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          containers=false
          if [[ "$EVENT_NAME" == workflow_dispatch || ( "$EVENT_NAME" == pull_request && "$BASE_REF" == main ) ]]; then
            containers=true
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            # Compare the entire PR, not just its last commit. Disable rename
            # detection so moving a watched file away still triggers checks.
            changes=$(mktemp)
            trap 'rm -f -- "$changes"' EXIT
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$changes"
            while IFS= read -r -d '' path; do
              case "$path" in
                deploy/*|scripts/*|.github/*|tests/*|.dockerignore|.env.example|.nvmrc|rust-toolchain*|\
                Cargo.toml|Cargo.lock|backend/Cargo.toml|backend/Cargo.lock|\
                .cargo/*|backend/.cargo/*|backend/build.rs|backend/migrations/*|\
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|\
                web/package.json|web/pnpm-lock.yaml|web/pnpm-workspace.yaml|web/.npmrc|\
                web/.pnpmfile.*|web/patches/*|web/*config*|web/index.html)
                  containers=true
                  break
                  ;;
              esac
            done < "$changes"
          fi
          echo "containers=$containers" >> "$GITHUB_OUTPUT"
          echo "Container checks: $containers"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Toolchains
        run: |
          corepack enable pnpm
          corepack prepare pnpm@12.5.1 --activate
          rustup show
          node --version
          pnpm --version
          rustc --version
      # Check caches are not release inputs. GitHub additionally isolates writes
      # from pull_request runs under refs/pull/<number>/merge.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm -C web store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: checks-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'web/package.json') }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            checks-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'web/package.json') }}-
      - name: Cache Cargo downloads and dependency builds
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          prefix-key: checks-rust-v1
          key: ${{ runner.os }}-${{ runner.arch }}
          workspaces: backend -> target
          cache-bin: false
      - name: Rust checks
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path backend/Cargo.toml --locked
          cargo build --manifest-path backend/Cargo.toml --locked
      - name: Shell syntax
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          bash tests/dev_script.sh
      - name: Web checks
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web run lint
          pnpm -C web run build
          pnpm -C web exec playwright install --with-deps chromium
      - name: Isolated HTTPS ingress
        run: |
          root=$(mktemp -d -t filehop-caddy-ci-XXXXXXXX)
          trap '[[ "$root" == /tmp/filehop-caddy-ci-* && -d "$root" && ! -L "$root" ]] && rm -rf -- "$root"' EXIT
          curl --fail --location --max-time 60 --output "$root/caddy.tar.gz" https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  $root/caddy.tar.gz" | sha512sum --check
          tar -xzf "$root/caddy.tar.gz" -C "$root" caddy
          PATH="$root:$PATH" bash tests/caddy_ingress.sh
      - name: Browser initialization loop
        run: bash tests/browser.sh
      - name: Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.dev.yml config --quiet
      - name: Set up Docker Buildx
        if: steps.scope.outputs.containers == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build backend container
        if: steps.scope.outputs.containers == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/backend.Dockerfile
          tags: filehop-issue6-backend
          load: true
          push: false
          cache-from: type=gha,version=2,scope=checks-backend-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,version=2,scope=checks-backend-${{ runner.os }}-${{ runner.arch }},mode=max
      - name: Build web container
        if: steps.scope.outputs.containers == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/web.Dockerfile
          tags: filehop-issue6-web
          load: true
          push: false
          cache-from: type=gha,version=2,scope=checks-web-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,version=2,scope=checks-web-${{ runner.os }}-${{ runner.arch }},mode=max
      - name: Container smoke tests
        if: steps.scope.outputs.containers == 'true'
        run: |
          bash tests/compose_smoke.sh
          bash tests/web_container_smoke.sh
