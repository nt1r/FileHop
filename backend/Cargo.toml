[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
fs2 = "0.4.3"
futures-util = "0.3.31"
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time", "sync"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
portable-pty = "0.9.0"
rustix = { version = "1.1.5", features = ["termios"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
